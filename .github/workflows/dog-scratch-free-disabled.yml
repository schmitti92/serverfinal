name: DOG scratch paid-only global mode
on:
  push:
    branches: [main]
    paths:
      - 'dog/christmas-scratch-settings.js'
      - 'tests/dog-christmas-scratch-settings.test.js'
      - '.github/workflows/dog-scratch-free-disabled.yml'
  workflow_dispatch:
jobs:
  test-free-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dog/christmas-scratch-settings.js
      - run: node --test --test-name-pattern="four scratch variants|global free mode|legacy host settings|global host scratch settings|earned DOG field tickets|one free simple ticket|paid ticket is atomic" tests/dog-christmas-scratch-settings.test.js tests/dog-christmas-scratch.test.js
