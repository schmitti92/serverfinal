name: Firebase Party Room Write No-ops (offline)
on:
  push:
    branches: [main]
    paths:
      - 'shared-lobby.js'
      - 'tests/firebase-party-room-write-noops.test.js'
      - '.github/workflows/firebase-party-room-write-noops.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-op-write-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server module syntax
        run: node --check shared-lobby.js
      - name: Execute actual Snake/Lava no-op room mutators without Firebase
        run: node --test tests/firebase-party-room-write-noops.test.js
