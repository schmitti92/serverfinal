name: Firebase Barikade idle write guard (offline)
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'barikade-write-fingerprint.js'
      - 'tests/firebase-barikade-idle-writes-offline.test.js'
      - '.github/workflows/firebase-barikade-idle-writes-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-op-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server and fingerprint syntax
        run: |
          node --check server.js
          node --check barikade-write-fingerprint.js
      - name: Verify only durable changes produce Barikade saves
        run: node --test tests/firebase-barikade-idle-writes-offline.test.js
