name: DOG 100-Tore Balance Check

on:
  push:
    paths:
      - dog-balance.js
      - dog-forge.js
      - dog-materials.js
      - deal-or-no-deal-api.js
      - dog-gates.js
      - dog-mini-rewards.js
      - dog-boss10.js
      - dog-group-boss.js
      - dog-boss-minigames.js
      - server.js
      - dog-ascension.js
      - tests/dog-balance.test.js
      - tests/dog-gates.test.js
      - tests/dog-mini-rewards.test.js
      - tests/dog-first-loop.test.js
      - tests/dog-group-boss.test.js
      - tests/dog-boss-minigames.test.js
      - tests/dog-boss-math-progression.test.js
      - tests/dog-boss-health.test.js
      - tests/dog-boss-exchange.test.js
      - tests/dog-gates-cors.test.js
      - tests/dog-forge.test.js
      - tests/dog-materials.test.js
      - .github/workflows/dog-balance-check.yml
  pull_request:
    paths:
      - dog-balance.js
      - dog-forge.js
      - dog-materials.js
      - deal-or-no-deal-api.js
      - dog-gates.js
      - dog-mini-rewards.js
      - dog-boss10.js
      - dog-group-boss.js
      - dog-boss-minigames.js
      - server.js
      - dog-ascension.js
      - tests/dog-balance.test.js
      - tests/dog-gates.test.js
      - tests/dog-mini-rewards.test.js
      - tests/dog-first-loop.test.js
      - tests/dog-group-boss.test.js
      - tests/dog-boss-minigames.test.js
      - tests/dog-boss-math-progression.test.js
      - tests/dog-boss-health.test.js
      - tests/dog-boss-exchange.test.js
      - tests/dog-gates-cors.test.js
      - tests/dog-forge.test.js
      - tests/dog-materials.test.js
      - .github/workflows/dog-balance-check.yml
  workflow_dispatch:

jobs:
  balance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check balance syntax
        run: |
          node --check dog-balance.js
          node --check dog-forge.js
          node --check dog-materials.js
          node --check deal-or-no-deal-api.js
          node --check dog-gates.js
          node --check dog-mini-rewards.js
          node --check tests/dog-mini-rewards.test.js
          node --check dog-boss10.js
          node --check dog-group-boss.js
          node --check dog-boss-minigames.js
          node --check tests/dog-boss-minigames.test.js
          node --check tests/dog-boss-math-progression.test.js
          node --check tests/dog-boss-health.test.js
          node --check tests/dog-boss-exchange.test.js
          node --check tests/dog-gates-cors.test.js
          node --check tests/dog-group-boss.test.js
          node --check dog-ascension.js
          node --check tests/dog-first-loop.test.js
          node --check tests/dog-balance.test.js
      - name: Run balance simulations and unit tests
        run: node --test tests/dog-gates-cors.test.js tests/dog-balance.test.js tests/dog-gates.test.js tests/dog-mini-rewards.test.js tests/dog-first-loop.test.js tests/dog-group-boss.test.js tests/dog-boss-minigames.test.js tests/dog-boss-math-progression.test.js tests/dog-boss-exchange.test.js tests/dog-boss-health.test.js tests/dog-forge.test.js tests/dog-materials.test.js
