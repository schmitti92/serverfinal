name: DOG classic official rules
on:
  push:
    branches: [main]
    paths:
      - 'dog/engine.js'
      - 'shared-lobby.js'
      - 'tests/shared-lobby.test.js'
      - 'tests/dog-engine.test.js'
      - 'tests/dog-official-rules.test.js'
      - '.github/workflows/dog-classic-official.yml'
  pull_request:
    paths:
      - 'dog/engine.js'
      - 'shared-lobby.js'
      - 'tests/shared-lobby.test.js'
      - 'tests/dog-engine.test.js'
      - 'tests/dog-official-rules.test.js'
  workflow_dispatch:
jobs:
  official-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dog/engine.js
      - run: node --test tests/dog-engine.test.js tests/dog-official-rules.test.js
      - run: node --test --test-name-pattern=DOG tests/shared-lobby.test.js
