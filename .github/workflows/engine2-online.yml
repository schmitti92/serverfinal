name: Engine 2 Online Checks
on:
  push:
    paths:
      - 'engine2/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/engine2-online.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --check engine2/api.js
      - run: node --test engine2/online.test.mjs
