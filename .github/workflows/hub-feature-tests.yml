name: Shared lobby feature tests
on:
  push:
    branches:
      - feature/gemeinsame-lobby-v1
      - feature/barikade-chat-v10
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep CI for the newest change instead of piling up redundant runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
