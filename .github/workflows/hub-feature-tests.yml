name: Shared lobby feature tests
on:
  push:
    branches:
      - feature/gemeinsame-lobby-v1
      - feature/barikade-chat-v10
      - main
    paths:
      - 'shared-lobby.js'
      - 'hub-*.js'
      - 'dog/player-levels.js'
      - 'dog/christmas-scratch*.js'
      - 'dog/christmas-tree-rewards.js'
      - 'tests/shared-lobby.test.js'
      - 'tests/dog-christmas-scratch*.test.js'
      - 'tests/dog-christmas-tree-rewards.test.js'
      - '.github/workflows/hub-feature-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep CI for the newest change instead of piling up redundant runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
