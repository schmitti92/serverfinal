name: Christmas ice checks
on:
  push:
    branches: [main]
    paths:
      - 'christmas-ice-*.js'
      - 'tests/christmas-ice-*.test.js'
      - '.github/workflows/christmas-ice-checks.yml'
  pull_request:
    paths:
      - 'christmas-ice-*.js'
      - 'tests/christmas-ice-*.test.js'
      - '.github/workflows/christmas-ice-checks.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check christmas-ice-engine.js
          node --check christmas-ice-api.js
          node --check christmas-ice-prizes.js
      - name: Unit tests
        run: node --test tests/christmas-ice-*.test.js
