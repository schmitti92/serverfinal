name: DOG hidden gold fields
on:
  push:
    branches: [main]
    paths:
      - 'dog/christmas-village.js'
      - 'dog/christmas-scratch.js'
      - 'shared-lobby.js'
      - 'tests/dog-christmas-gold.test.js'
      - 'tests/dog-christmas-village.test.js'
      - '.github/workflows/dog-christmas-gold.yml'
  pull_request:
    paths:
      - 'dog/christmas-village.js'
      - 'dog/christmas-scratch.js'
      - 'shared-lobby.js'
      - 'tests/dog-christmas-gold.test.js'
      - '.github/workflows/dog-christmas-gold.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dog/christmas-village.js && node --check dog/christmas-scratch.js && node --check shared-lobby.js
      - run: node --test tests/dog-christmas-gold.test.js tests/dog-christmas-village.test.js
