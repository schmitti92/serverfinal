name: Grinch Mission 3 foundation
on:
  push:
    branches: [main]
    paths:
      - 'dog/grinch-mission3.js'
      - 'tests/dog-grinch-mission3-foundation.test.js'
      - '.github/workflows/grinch-mission3-foundation.yml'
  pull_request:
    paths:
      - 'dog/grinch-mission3.js'
      - 'tests/dog-grinch-mission3-foundation.test.js'
      - '.github/workflows/grinch-mission3-foundation.yml'
  workflow_dispatch:
jobs:
  mission3-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dog-grinch-mission3-foundation.test.js
