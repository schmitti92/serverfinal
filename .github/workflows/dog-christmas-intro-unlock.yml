name: DOG Christmas First Match Unlock
on:
  push:
    branches: [main]
    paths:
      - 'shared-lobby.js'
      - 'tests/dog-christmas-intro-unlock.test.js'
      - '.github/workflows/dog-christmas-intro-unlock.yml'
  workflow_dispatch:
jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/dog-christmas-intro-unlock.test.js
