name: Firebase KreuzKunter Presence Writes (offline)
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'tests/kreuz-hub.test.js'
      - '.github/workflows/firebase-kreuz-presence-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kreuz-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server module syntax
        run: node --check server.js
      - name: Run KreuzKunter real engine with in-memory Firestore write counters
        run: node --test tests/kreuz-hub.test.js
