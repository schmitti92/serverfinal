name: DOG durable room Postgres foundation (offline)
on:
  pull_request:
    paths:
      - 'dog-postgres-room-store.js'
      - 'dog-postgres-classic-adapter.js'
      - 'dog-postgres-private-fanout.js'
      - 'tests/dog-postgres-private-fanout-offline.test.js'
      - 'dog-postgres-xp-settlement.js'
      - 'tests/dog-postgres-xp-settlement-offline.test.js'
      - 'dog-postgres-finalization.js'
      - 'tests/dog-postgres-finalization-offline.test.js'
      - 'dog-postgres-christmas-settlement.js'
      - 'tests/dog-postgres-christmas-settlement-offline.test.js'
      - 'dog-postgres-settlement-recovery.js'
      - 'tests/dog-postgres-settlement-recovery-offline.test.js'
      - 'dog-postgres-seasonal-final-settlement.js'
      - 'tests/dog-postgres-seasonal-final-settlement-offline.test.js'
      - 'migrations/20261122_dog_durable_rooms.sql'
      - 'tests/dog-postgres-room-store-offline.test.js'
      - '.github/workflows/dog-postgres-room-store-offline.yml'
  push:
    branches: [main]
    paths:
      - 'dog-postgres-room-store.js'
      - 'dog-postgres-classic-adapter.js'
      - 'dog-postgres-private-fanout.js'
      - 'tests/dog-postgres-private-fanout-offline.test.js'
      - 'dog-postgres-xp-settlement.js'
      - 'tests/dog-postgres-xp-settlement-offline.test.js'
      - 'dog-postgres-finalization.js'
      - 'tests/dog-postgres-finalization-offline.test.js'
      - 'dog-postgres-christmas-settlement.js'
      - 'tests/dog-postgres-christmas-settlement-offline.test.js'
      - 'dog-postgres-settlement-recovery.js'
      - 'tests/dog-postgres-settlement-recovery-offline.test.js'
      - 'dog-postgres-seasonal-final-settlement.js'
      - 'tests/dog-postgres-seasonal-final-settlement-offline.test.js'
      - 'migrations/20261122_dog_durable_rooms.sql'
      - 'tests/dog-postgres-room-store-offline.test.js'
      - '.github/workflows/dog-postgres-room-store-offline.yml'
permissions:
  contents: read
jobs:
  durable-room-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dog-postgres-room-store.js && node --check dog-postgres-classic-adapter.js && node --check dog-postgres-private-fanout.js && node --check tests/dog-postgres-room-store-offline.test.js && node --check tests/dog-postgres-private-fanout-offline.test.js && node --check dog-postgres-xp-settlement.js && node --check tests/dog-postgres-xp-settlement-offline.test.js && node --check dog-postgres-finalization.js && node --check tests/dog-postgres-finalization-offline.test.js && node --check dog-postgres-christmas-settlement.js && node --check tests/dog-postgres-christmas-settlement-offline.test.js && node --check dog-postgres-settlement-recovery.js && node --check tests/dog-postgres-settlement-recovery-offline.test.js && node --check dog-postgres-seasonal-final-settlement.js && node --check tests/dog-postgres-seasonal-final-settlement-offline.test.js
      - run: node --test tests/dog-postgres-room-store-offline.test.js tests/dog-postgres-private-fanout-offline.test.js tests/dog-postgres-xp-settlement-offline.test.js tests/dog-postgres-finalization-offline.test.js tests/dog-postgres-christmas-settlement-offline.test.js tests/dog-postgres-settlement-recovery-offline.test.js tests/dog-postgres-seasonal-final-settlement-offline.test.js
