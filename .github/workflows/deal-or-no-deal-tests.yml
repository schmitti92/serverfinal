name: Deal or No Deal gameplay regression
on:
  push:
    branches: [main]
    paths:
      - 'deal-or-no-deal.js'
      - 'deal-or-no-deal-api.js'
      - 'tests/deal-or-no-deal.test.js'
      - 'tests/deal-websocket.test.js'
      - '.github/workflows/deal-or-no-deal-tests.yml'
  pull_request:
    paths:
      - 'deal-or-no-deal.js'
      - 'deal-or-no-deal-api.js'
      - 'tests/deal-or-no-deal.test.js'
      - 'tests/deal-websocket.test.js'
      - '.github/workflows/deal-or-no-deal-tests.yml'
  workflow_dispatch:
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 1-4 player gameplay and privacy
        run: node --test tests/deal-or-no-deal.test.js tests/deal-websocket.test.js
