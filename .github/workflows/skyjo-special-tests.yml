name: SKYJO 100 Tore Special server tests
on:
  push:
    branches: [main]
    paths:
      - 'skyjo-special-engine.js'
      - 'deal-or-no-deal-api.js'
      - 'shared-lobby.js'
      - 'tests/skyjo-special-engine.test.js'
      - '.github/workflows/skyjo-special-tests.yml'
  pull_request:
    paths:
      - 'skyjo-special-engine.js'
      - 'deal-or-no-deal-api.js'
      - 'shared-lobby.js'
      - 'tests/skyjo-special-engine.test.js'
  workflow_dispatch:
jobs:
  special-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check deal-or-no-deal-api.js
      - run: node --check skyjo-special-engine.js
      - run: node --check server.js
      - run: node --test tests/skyjo-special-engine.test.js
