name: DOG Premium mixed guaranteed winnings
on:
  push:
    branches: [main]
    paths:
      - 'dog/christmas-other-editions.js'
      - 'dog/christmas-scratch.js'
      - 'dog/christmas-premium27.js'
      - 'tests/dog-premium-mixed-guarantees.test.js'
      - 'tests/dog-other-editions.test.js'
      - 'tests/christmas-scratch-purchase.test.js'
      - '.github/workflows/dog-premium-mixed-guarantees.yml'
  pull_request:
    paths:
      - 'dog/christmas-other-editions.js'
      - 'tests/dog-premium-mixed-guarantees.test.js'
  workflow_dispatch:
jobs:
  premium-mixed-guarantees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dog/christmas-other-editions.js && node --check dog/christmas-scratch.js
      - run: node --test tests/dog-premium-mixed-guarantees.test.js tests/dog-other-editions.test.js
      - run: node --test --test-name-pattern='premium|Premium|27-cell' tests/christmas-scratch-purchase.test.js
