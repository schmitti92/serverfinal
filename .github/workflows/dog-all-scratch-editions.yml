name: DOG All Scratch Editions
on:
  push:
    branches: [main]
    paths:
      - 'dog/christmas-other-editions.js'
      - 'dog/christmas-scratch.js'
      - 'dog/christmas-special-scratch.js'
      - 'dog/christmas-premium27.js'
      - 'christmas-scratch-api.js'
      - 'tests/dog-other-editions.test.js'
      - '.github/workflows/dog-all-scratch-editions.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dog/christmas-other-editions.js
      - run: node --check dog/christmas-scratch.js
      - run: node --check dog/christmas-special-scratch.js
      - run: node --check christmas-scratch-api.js
      - run: node --test tests/dog-other-editions.test.js tests/dog-tic-edition.test.js
