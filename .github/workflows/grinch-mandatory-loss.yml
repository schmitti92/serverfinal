name: Grinch mission 1-3 loss regressions
on:
  push:
    branches: [main]
    paths:
      - 'dog/grinch-loss-policy.js'
      - 'dog/grinch-mission1.js'
      - 'dog/grinch-mission2.js'
      - 'tests/grinch-campaign-mandatory-loss.test.js'
      - 'tests/dog-grinch-mission1.test.js'
      - 'tests/dog-grinch-mission2.test.js'
      - 'tests/dog-grinch-mission2-hub.test.js'
      - '.github/workflows/grinch-mandatory-loss.yml'
  pull_request:
    paths:
      - 'dog/grinch*'
      - 'tests/grinch-campaign-mandatory-loss.test.js'
      - 'tests/dog-grinch-mission1.test.js'
      - 'tests/dog-grinch-mission2.test.js'
      - 'tests/dog-grinch-mission2-hub.test.js'
      - '.github/workflows/grinch-mandatory-loss.yml'
  workflow_dispatch:
jobs:
  check-losses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/grinch-campaign-mandatory-loss.test.js tests/dog-grinch-mission1.test.js tests/dog-grinch-mission2.test.js tests/dog-grinch-mission2-hub.test.js
