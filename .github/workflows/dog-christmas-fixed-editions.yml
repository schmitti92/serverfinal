name: DOG Fixed Budget Editions
on:
  push:
    branches: [main]
    paths:
      - 'dog/christmas-edition-plan.js'
      - 'dog/christmas-gifts-edition.js'
      - 'dog/christmas-snow-edition.js'
      - 'dog/christmas-scratch.js'
      - 'dog/christmas-scratch-settings.js'
      - 'shared-lobby.js'
      - 'tests/dog-christmas-fixed-editions.test.js'
      - 'tests/dog-christmas-gifts-edition.test.js'
      - 'tests/dog-christmas-snow-edition.test.js'
      - '.github/workflows/dog-christmas-fixed-editions.yml'
  pull_request:
    paths:
      - 'dog/christmas-edition-plan.js'
      - 'dog/christmas-gifts-edition.js'
      - 'dog/christmas-snow-edition.js'
      - 'dog/christmas-scratch.js'
      - 'shared-lobby.js'
      - 'tests/dog-christmas-fixed-editions.test.js'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  exact-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dog/christmas-edition-plan.js
      - run: node --check dog/christmas-gifts-edition.js
      - run: node --check dog/christmas-snow-edition.js
      - run: node --check dog/christmas-scratch.js
      - run: node --check shared-lobby.js
      - run: node --test tests/dog-christmas-fixed-editions.test.js tests/dog-christmas-gifts-edition.test.js tests/dog-christmas-snow-edition.test.js
