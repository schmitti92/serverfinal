name: Engine V2 rule and contract tests
on:
  push:
    branches: [main]
    paths:
      - 'engine2/**'
      - 'shared-lobby.js'
      - 'package.json'
      - '.github/workflows/engine2-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
